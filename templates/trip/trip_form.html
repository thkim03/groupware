{% extends 'layout/base.html' %}
{% block title %}출장신청{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header"><h4>출장신청서 작성</h4></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">목적지</label>
            <input type="text" name="destination" class="form-control" required>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">출발일</label>
              <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">귀환일</label>
              <input type="date" name="end_date" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">출장 목적</label>
            <textarea name="purpose" class="form-control" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">결재선 선택</label>
            <select name="approvers" class="form-select" multiple size="6" required>
              {% for emp in employees %}
              {% if emp != user %}
              <option value="{{ emp.pk }}">{{ emp }} - {{ emp.department }}</option>
              {% endif %}
              {% endfor %}
            </select>
            <small class="text-muted">Ctrl(또는 Cmd) 클릭으로 여러 명 선택</small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">상신</button>
            <a href="{% url 'trip:trip_list' %}" class="btn btn-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
