{% extends 'layout/base.html' %}
{% block title %}문서 취소{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header"><h5>문서 취소 확인</h5></div>
      <div class="card-body">
        <p>다음 문서를 취소하시겠습니까?</p>
        <p><strong>{{ doc.title }}</strong> ({{ doc.get_doc_type_display }})</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">취소 확인</button>
            <a href="{% url 'approvals:sent' %}" class="btn btn-secondary">돌아가기</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
