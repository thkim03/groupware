{% extends 'layout/base.html' %}
{% block title %}구매요청{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header"><h4>구매요청서 작성</h4></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <h6>구매 항목</h6>
          <table class="table table-sm" id="items-table">
            <thead><tr><th>품명</th><th>단가</th><th>수량</th><th></th></tr></thead>
            <tbody id="items-body">
              <tr>
                <td><input type="text" name="item_name" class="form-control form-control-sm" placeholder="품명" required></td>
                <td><input type="number" name="item_price" class="form-control form-control-sm" placeholder="단가" required></td>
                <td><input type="number" name="item_qty" class="form-control form-control-sm" value="1" min="1" required></td>
                <td><button type="button" class="btn btn-sm btn-danger" onclick="removeRow(this)">삭제</button></td>
              </tr>
            </tbody>
          </table>
          <button type="button" class="btn btn-sm btn-secondary mb-3" onclick="addRow()">+ 항목 추가</button>
          <div class="mb-3">
            <label class="form-label">결재선 선택</label>
            <select name="approvers" class="form-select" multiple size="6" required>
              {% for emp in employees %}
              {% if emp != user %}
              <option value="{{ emp.pk }}">{{ emp }} - {{ emp.department }}</option>
              {% endif %}
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">상신</button>
            <a href="{% url 'purchase:purchase_list' %}" class="btn btn-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function addRow() {
  const tbody = document.getElementById('items-body');
  const row = tbody.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => i.value = i.type === 'number' && i.name === 'item_qty' ? '1' : '');
  tbody.appendChild(row);
}
function removeRow(btn) {
  const tbody = document.getElementById('items-body');
  if (tbody.rows.length > 1) btn.closest('tr').remove();
}
</script>
{% endblock %}
