{% extends 'layout/base.html' %}
{% block title %}휴가신청{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header"><h4>휴가신청서 작성</h4></div>
      <div class="card-body">
        <p class="text-muted">잔여 연차: <strong>{{ user.annual_leave_days }}일</strong></p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text" name="title" class="form-control" placeholder="예: 홍길동 연차신청" required>
          </div>
          <div class="mb-3">
            <label class="form-label">휴가종류</label>
            <select name="leave_type" id="id_leave_type" class="form-select" required>
              {% for val, label in leave_types %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">시작일</label>
              <input type="date" name="start_date" id="id_start_date" class="form-control" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">종료일</label>
              <input type="date" name="end_date" id="id_end_date" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">일수 <small class="text-muted">(자동 계산)</small></label>
            <input type="number" name="days_count" id="id_days_count" class="form-control" step="0.5" min="0.5" readonly required>
          </div>
          <div class="mb-3">
            <label class="form-label">결재선 선택 (순서대로 선택)</label>
            <select name="approvers" class="form-select" multiple size="6" required>
              {% for emp in employees %}
              {% if emp != user %}
              <option value="{{ emp.pk }}">{{ emp }} - {{ emp.department }}</option>
              {% endif %}
              {% endfor %}
            </select>
            <small class="text-muted">Ctrl(또는 Cmd) 클릭으로 여러 명 선택 가능. 선택 순서대로 결재</small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">상신</button>
            <a href="{% url 'leave:leave_list' %}" class="btn btn-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const HALF_TYPES = ['MORNING_HALF', 'AFTERNOON_HALF'];

function countWeekdays(startStr, endStr) {
  let count = 0;
  const cur = new Date(startStr + 'T00:00:00');
  const last = new Date(endStr + 'T00:00:00');
  while (cur <= last) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

function recalc() {
  const leaveType = document.getElementById('id_leave_type').value;
  const startVal = document.getElementById('id_start_date').value;
  const endField = document.getElementById('id_end_date');
  const daysField = document.getElementById('id_days_count');

  if (HALF_TYPES.includes(leaveType)) {
    if (startVal) {
      endField.value = startVal;
      endField.readOnly = true;
    }
    daysField.value = '0.5';
    return;
  }

  endField.readOnly = false;
  const endVal = endField.value;

  if (startVal && endVal) {
    if (endVal < startVal) {
      endField.value = startVal;
      daysField.value = '1';
      return;
    }
    const days = countWeekdays(startVal, endVal);
    daysField.value = days > 0 ? days : '';
  }
}

document.getElementById('id_leave_type').addEventListener('change', recalc);
document.getElementById('id_start_date').addEventListener('change', recalc);
document.getElementById('id_end_date').addEventListener('change', recalc);
</script>
{% endblock %}
