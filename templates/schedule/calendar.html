{% extends 'layout/base.html' %}
{% block title %}일정관리{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2><i class="bi bi-calendar3"></i> 일정관리</h2>
  <a href="{% url 'schedule:create' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> 일정 등록</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <div id="calendar"></div>
  </div>
</div>

<!-- 일정 상세 모달 -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="eventModalTitle"></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="eventModalBody"></div>
      <div class="modal-footer" id="eventModalFooter"></div>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/ko.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    locale: 'ko',
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,listMonth'
    },
    events: '{% url "schedule:events_json" %}',
    eventClick: function(info) {
      const ev = info.event;
      const p = ev.extendedProps;
      document.getElementById('eventModalTitle').textContent = ev.title;
      let body = '';
      if (p.author) body += `<p><strong>작성자:</strong> ${p.author}</p>`;
      if (p.category) body += `<p><strong>공개범위:</strong> ${p.category}</p>`;
      if (p.memo) body += `<p><strong>메모:</strong> ${p.memo}</p>`;
      document.getElementById('eventModalBody').innerHTML = body || '상세 정보 없음';
      let footer = '<button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>';
      if (p.type === 'schedule' && p.pk) {
        footer += ` <a href="/schedule/${p.pk}/edit/" class="btn btn-primary btn-sm">수정</a>`;
        footer += ` <form method="post" action="/schedule/${p.pk}/delete/" class="d-inline" onsubmit="return confirm('삭제하시겠습니까?')">
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
          <button type="submit" class="btn btn-danger btn-sm">삭제</button>
        </form>`;
      }
      document.getElementById('eventModalFooter').innerHTML = footer;
      new bootstrap.Modal(document.getElementById('eventModal')).show();
    },
    dateClick: function(info) {
      window.location.href = '{% url "schedule:create" %}?date=' + info.dateStr;
    },
    height: 'auto',
  });
  calendar.render();
});
</script>
{% endblock %}
